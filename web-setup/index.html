<style>

html,body{height:auto;overflow:visible}
main{max-width:720px}
.card+.card,#ui .card{margin-top:16px}

#ui h2:first-child{margin-top:0}
.live{display:grid;gap:10px;margin-top:6px}

.srow.chg .rst{visibility:visible}.rst:hover{color:#fff;border-color:rgba(255,255,255,.4)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;cursor:pointer}

input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-7px;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.5)}

.pnav a:hover{color:#fff}.pnav a[aria-current]{background:#fff;color:#000}

function logAdd(s) { logLines.push(new Date().toTimeString().slice(0, 8) + ' ' + s); if (logLines.length > 400) logLines.shift(); var el = $('log'); if ($('diag').open) { el.textContent = logLines.join('\n'); el.scrollTop = el.scrollHeight; } }
function onLine(line) {
  line = line.replace(/\r/g, ''); if (line.indexOf('PB:LIVE ') < 0) logAdd('< ' + line);
  var i = line.indexOf('PB:'); if (i < 0) return; line = line.slice(i + 3).trim();
  var sp = line.indexOf(' '), cmd = sp < 0 ? line : line.slice(0, sp), rest = sp < 0 ? '' : line.slice(sp + 1);
  if (cmd === 'READY') { if (gotCfg) { restarted = true; failSave(); } send('?'); }
  else if (cmd === 'CFG') {
    try { cfg = JSON.parse(rest); } catch (e) { return; }

    status('on', t('st_fw') + ' ' + cfg.fw); $('fwDev').textContent = cfg.fw; buildSliders(); $('ui').hidden = false; $('howto').hidden = true;

  }
}

async function readLoop() {
  var dec = new TextDecoder(), buf = '';
  while (port && port.readable && keepReading) {
    reader = port.readable.getReader();
    try {
      for (;;) {
        var r = await reader.read(); if (r.done) break;
        buf += dec.decode(r.value, { stream: true });
        var n; while ((n = buf.indexOf('\n')) >= 0) { onLine(buf.slice(0, n)); buf = buf.slice(n + 1); }
        if (buf.length > 4096) buf = '';
      }
    } catch (e) { /* Gerät abgezogen */ }
    finally { try { reader.releaseLock(); } catch (e) {} reader = null; }
    if (!keepReading) break;
    break;
  }
  if (keepReading) { await disconnect(true); msg(t('m_lost'), true); }
}

async function connect(known) {
  msg('');
  if (known) port = known;
  else { try { port = await navigator.serial.requestPort(); } catch (e) { return; } }
  lastPort = port;
  try { await port.open({ baudRate: 115200 }); }
  catch (e) { port = null; msg(t('m_busy'), true); return; }
  status('wait'); $('btnConnect').textContent = t('disconnect'); gotCfg = false;
  logAdd('-- verbunden, starte Modul neu');
  await resetModule();
  writer = port.writable.getWriter(); keepReading = true; readLoop();
  if (await waitCfg(7)) return;
  // 2. Versuch: Anschluss schließen, neu öffnen, nochmal neu starten (wie ein zweiter Klick)
  if (!port) return;
  msg(t('m_retry')); logAdd('-- keine Antwort, neuer Versuch');
  var p = port; await disconnect(true); port = p; lastPort = p;
  await sleep(300);
  try { await port.open({ baudRate: 115200 }); } catch (e) { port = null; msg(t('m_busy'), true); return; }
  status('wait'); $('btnConnect').textContent = t('disconnect');
  await resetModule();
  writer = port.writable.getWriter(); keepReading = true; readLoop();
  if (await waitCfg(9)) return;
  if (port) msg(t('m_noresp'), true);
}
// EN kurz auf Low (RTS), BOOT (DTR) bleibt High -> normaler Programmstart
async function resetModule() {
  try { await port.setSignals({ dataTerminalReady: false, requestToSend: false }); await sleep(50);
        await port.setSignals({ dataTerminalReady: false, requestToSend: true }); await sleep(150);
        await port.setSignals({ dataTerminalReady: false, requestToSend: false }); } catch (e) { logAdd('-- Reset nicht möglich: ' + e); }
}
async function waitCfg(sec) {
  for (var i = 0; i < sec && !gotCfg && port; i++) { await sleep(1000); if (!gotCfg && port && i >= 1) send('?'); }
  return gotCfg;
}

async function disconnect(silent) {

  try { if (writer) { await send('L0'); writer.releaseLock(); } } catch (e) {}
  writer = null;
  try { if (reader) await reader.cancel(); } catch (e) {}
  try { if (port) await port.close(); } catch (e) {}

  clearTimeout(saveTimer); saveTimer = null; $('btnSave').disabled = false;
  status('off'); $('btnConnect').textContent = t('connect'); $('ui').hidden = true; $('howto').hidden = false;
  if (!silent) msg('');
}

async function flash() {

  }
  flashing = true; $('btnFlash').disabled = true; $('btnConnect').disabled = true; fwProg(0);
  var transport = null, ok = false, stage = 'dl';
  try {
    fwMsg(t('fw_dl'));
    if (!fwInfo) fwInfo = await (await fetch(FW_DIR + 'version.json', { cache: 'no-store' })).json();
    var file = mode === 'full' ? fwInfo.full : fwInfo.update;
    var resp = await fetch(FW_DIR + file + '?v=' + encodeURIComponent(fwInfo.version), { cache: 'no-store' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    var data = new Uint8Array(await resp.arrayBuffer());
    if (data.length < 65536 || data[0] !== 0xE9 && mode !== 'full') throw new Error('bad image');
    stage = 'con'; fwMsg(t('fw_con'));
    var lib = await import('./esptool-bundle.js?v=0.7.1');
    transport = new lib.Transport(p, false);
    var term = { clean: function () {}, writeLine: function (s) { console.log('[esptool] ' + s); }, write: function (s) { console.log('[esptool] ' + s); } };
    var loader = new lib.ESPLoader({ transport: transport, baudrate: 460800, romBaudrate: 115200, terminal: term });
    await loader.main();
    stage = 'wr'; fwMsg(t('fw_wr').replace('%s', '0'));
    await loader.writeFlash({
      fileArray: [{ data: data, address: mode === 'full' ? 0x0 : 0x10000 }],
      flashMode: 'keep', flashFreq: 'keep', flashSize: 'keep', eraseAll: false, compress: true,
      reportProgress: function (i, w, tot) { var pc = Math.round(w / tot * 100); fwProg(pc); fwMsg(t('fw_wr').replace('%s', pc)); }
    });
    stage = 'rs'; fwMsg(t('fw_rs'));
    await loader.after('hard_reset');
    ok = true;
  } catch (e) {
    console.error(e);
    if (stage === 'dl') fwMsg(t('fw_errdl'), true);
    else if (stage === 'con') fwMsg(t('fw_errcon'), true);
    else fwMsg(t('fw_err').replace('%s', (e && e.message) || e), true);
  }
  try { if (transport) await transport.disconnect(); } catch (e) {}
  try { if (p && p.readable) await p.close(); } catch (e) {}
  flashing = false; $('btnFlash').disabled = false; $('btnConnect').disabled = false;
  if (ok) {
    fwProg(100); $('fwDev').textContent = fwInfo.version;
    fwMsg(t('fw_okre').replace('%s', fwInfo.version));
    await sleep(1500);
    await connect(p);
    fwMsg(t('fw_ok').replace('%s', fwInfo.version));
  } else fwProg(-1);
}
$('btnFlash').addEventListener('click', flash);
})();
</script>
